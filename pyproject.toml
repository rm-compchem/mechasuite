[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "mechasuite"
version = "0.1.0"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake]
minimum-version = "3.15"

[project.scripts]
mechadata = "mechasuite.mechadata:main"
mechakinetics = "mechasuite.mechakinetics:main"


